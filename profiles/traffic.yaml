name: traffic
title: Traffic
description: Vehicles + person, YOLO realtime, smart 3B deepen

profile: traffic

capture:
  monitor: 0
  ui_monitor: 0
  region: null
  max_width: 1920   # downscale 4K grabs before YOLO (0 = off)

detection:
  classes: [person, car, truck, bus, motorcycle, bicycle]
  conf: 0.2

yolo:
  enabled: true
  backend: coco
  weights: yolov8m.pt
  conf: 0.2
  imgsz: 1280
  max_det: 300
  classes: []
  keep_class_ids: [0, 1, 2, 3, 5, 7]  # person bicycle car motorcycle bus truck

locate3b:
  enabled: true
  model_path: LocateAnything-3B
  generation_mode: hybrid
  max_side: 960
  max_new_tokens: 768
  classes: [person, car, truck, bus, motorcycle, bicycle, traffic light]

trigger:
  labels: [person, car, truck, bus, motorcycle]
  skip_above_conf: 0.90
  uncertain_below_conf: 0.65
  min_conf: 0.3
  on_new_label: true
  cooldown_sec: 2.0
  max_roi_boxes: 4
  max_pending_jobs: 1

reasoning:
  enabled: true
  prompt: "Analyze traffic situation and describe vehicles, people, and risks."

dual_brain:
  enabled: true
  force_labels: []

tracker:
  enabled: true

events:
  enabled: true
  db_path: data/events.db
