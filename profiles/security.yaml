name: security
title: Security / Open-world
description: Broader open-world deepen for security-ish categories

profile: security

capture:
  monitor: 0
  ui_monitor: 0
  region: null
  max_width: 1920

detection:
  classes: [person, car, truck, backpack, handbag, suitcase, knife, gun, rifle, drone]
  conf: 0.25

yolo:
  enabled: true
  backend: coco
  weights: yolov8m.pt
  conf: 0.25
  imgsz: 1280
  max_det: 300
  classes: []
  keep_class_ids: [0, 2, 3, 5, 7]

deep_backend: locate3b

locate3b:
  enabled: true
  model_path: LocateAnything-3B
  generation_mode: hybrid
  max_side: 1024
  max_new_tokens: 1024
  classes: [person, car, truck, backpack, handbag, suitcase, knife, gun, rifle, drone]

mage_vl:
  model_path: microsoft/Mage-VL
  max_side: 960
  max_new_tokens: 256
  question: "Analyze security-relevant objects and describe why an alert may be needed."

trigger:
  labels: [person, car, truck, backpack, handbag]
  force_labels: [gun, rifle, drone, knife]
  skip_above_conf: 0.88
  uncertain_below_conf: 0.70
  min_conf: 0.3
  on_new_label: true
  cooldown_sec: 2.0
  max_roi_boxes: 3
  max_pending_jobs: 1

reasoning:
  enabled: true
  prompt: "Analyze security-relevant objects and describe why an alert may be needed."

dual_brain:
  enabled: true

tracker:
  enabled: true

events:
  enabled: true
  db_path: data/events.db
